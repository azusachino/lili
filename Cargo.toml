[package]
name = "lili"
version = "0.1.1"
authors = ["azusachino <azusachino@duck.com>"]
edition = "2021"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/azusachino/lili"

[dependencies]
anyhow = "1"
thiserror = "2"

# cli
clap = { version = "4", features = ["derive"] }
toml = "0.9"

# serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# async
futures = "0.3"
tokio = { version = "1", features = ["full"] }

# utils
num_cpus = "1"
lazy_static = "1.5"
shellexpand = "3.1"

# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }